<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Loading -->
      <div id="state-loading" class="state">
        <div class="center-content">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- Signed out -->
      <div id="state-signed-out" class="state hidden">
        <div class="center-content">
          <div class="logo">cozy job tracker</div>
          <p class="subtitle">Sign in to start adding jobs</p>
          <button id="btn-sign-in" class="btn btn-primary">Sign in</button>
        </div>
      </div>

      <!-- Ready -->
      <div id="state-ready" class="state hidden">
        <div class="header">
          <div class="logo-sm">cozy job tracker</div>
          <button id="btn-sign-out" class="btn-ghost btn-sm" title="Sign out">Sign out</button>
        </div>
        <div class="user-row">
          <svg
            class="user-icon"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="8" cy="5.5" r="2.5" />
            <path d="M2.5 14c0-2.5 2-4.5 5.5-4.5s5.5 2 5.5 4.5" />
          </svg>
          <span id="user-email" class="user-email"></span>
        </div>
        <div class="url-card">
          <div class="url-label">Current page</div>
          <div id="current-url" class="url-text"></div>
        </div>
        <button id="btn-add" class="btn btn-primary btn-full">Add to board</button>
      </div>

      <!-- Adding (parsing) -->
      <div id="state-adding" class="state hidden">
        <div class="center-content">
          <div class="spinner"></div>
          <p class="adding-text">Parsing job posting...</p>
        </div>
      </div>

      <!-- Preview (parsed, not yet saved) -->
      <div id="state-preview" class="state hidden">
        <div class="header">
          <div class="logo-sm">cozy job tracker</div>
        </div>
        <p class="preview-heading">Preview</p>
        <div class="preview-card">
          <div class="preview-row">
            <span class="preview-label">Title</span>
            <span class="preview-value" id="preview-title"></span>
          </div>
          <div class="preview-row">
            <span class="preview-label">Company</span>
            <span class="preview-value" id="preview-company"></span>
          </div>
          <div class="preview-row">
            <span class="preview-label">Location</span>
            <span class="preview-value" id="preview-location"></span>
          </div>
          <div class="preview-row">
            <span class="preview-label">Type</span>
            <span class="preview-value" id="preview-type"></span>
          </div>
          <div class="preview-row hidden" id="preview-due-date-row">
            <span class="preview-label">Due date</span>
            <span class="preview-value" id="preview-due-date"></span>
          </div>
          <div class="preview-row hidden" id="preview-notes-row">
            <span class="preview-label">Notes</span>
            <span class="preview-value" id="preview-notes"></span>
          </div>
          <div class="preview-row">
            <span class="preview-label">Verified</span>
            <span class="preview-value" id="preview-verified"></span>
          </div>
        </div>
        <div class="preview-warning hidden" id="preview-warning"></div>
        <div class="preview-actions">
          <button id="btn-confirm" class="btn btn-primary btn-full">Add to board</button>
          <button id="btn-discard" class="btn btn-soft btn-full">Discard</button>
        </div>
      </div>

      <!-- Saving (after confirm) -->
      <div id="state-saving" class="state hidden">
        <div class="center-content">
          <div class="spinner"></div>
          <p class="adding-text">Adding to board...</p>
        </div>
      </div>

      <!-- Success -->
      <div id="state-success" class="state hidden">
        <div class="center-content">
          <div class="success-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </div>
          <p class="success-title" id="success-title"></p>
          <p class="success-company" id="success-company"></p>
          <div class="success-actions">
            <a id="link-board" class="btn btn-primary btn-sm" href="#">View board</a>
            <button id="btn-add-another" class="btn btn-soft btn-sm">Add another</button>
          </div>
        </div>
      </div>

      <!-- Error -->
      <div id="state-error" class="state hidden">
        <div class="center-content">
          <div class="error-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
          </div>
          <p class="error-message" id="error-message"></p>
          <button id="btn-retry" class="btn btn-soft">Try again</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
